<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रशासन प्यानल - दशाैँदी समाज नेपाल</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #008000;
            --danger-color: #e53e3e;
            --bg-color: #edf2f7;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #cbd5e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .admin-container {
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .main-header-box {
            background: linear-gradient(135deg, #1a365d, #2b6cb0);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(26, 54, 93, 0.2);
        }

        .main-header-box h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0.5px;
            color: white;
        }

        /* हेडलाइन र दाяे पट्टिको बटन मिलाउने स्टाइल */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f7fafc;
            padding: 10px 15px;
            border-left: 5px solid var(--accent-color);
            border-radius: 0 6px 6px 0;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        .section-header h3 {
            margin: 0;
            color: var(--primary-color);
            font-size: 20px;
            border: none;
            padding: 0;
            background: none;
        }

        .toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: auto;
        }

        .toggle-btn:hover {
            background-color: #2b6cb0;
        }

        /* लुकाउने वा देखाउने सेक्सन */
        .collapsible-content {
            display: none;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.15);
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button[type="submit"]:hover {
            background-color: #006600;
        }

        .btn-danger {
            background-color: var(--danger-color);
            padding: 6px 12px;
            font-size: 13px;
            width: auto;
            border-radius: 4px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-danger:hover {
            background-color: #c53030;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e2e8f0;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .welcome-text {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 15px;
        }

        .logout-btn {
            background: #4a5568;
            color: white;
            border: none;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #2d3748;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
        }

        .hidden {
            display: none;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        hr {
            margin: 40px 0;
            border: 0;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="main-header-box">
            <h2>दशाैँदी समाज नेपाल - एडमिन प्यानल</h2>
        </div>

        <!-- १. लगइन सेक्सन -->
        <div id="loginSection">
            <h3 style="text-align: center; border-left: none; padding-left: 0;">प्रशासन लगइन</h3>
            <form id="loginForm" style="max-width: 400px; margin: 0 auto;">
                <div class="form-group">
                    <label>युजरनेम (Username):</label>
                    <input type="text" id="username" placeholder="युजरनेम हाल्नुहोस्" required>
                </div>
                <div class="form-group">
                    <label>पासवर्ड (Password):</label>
                    <input type="password" id="password" placeholder="पासवर्ड हाल्नुहोस्" required>
                </div>
                <button type="submit">लगइन गर्नुहोस्</button>
            </form>
        </div>

        <!-- २. मुख्य ड्यासबोर्ड -->
        <div id="dashboardSection" class="hidden">
            <div class="top-header">
                <span class="welcome-text">✔ स्वागत छ, एडमिन!</span>
                <button class="logout-btn" onclick="logout()">लगआउट हुनुहोस्</button>
            </div>

            <!-- संस्थाको मुख्य विवरण - टोگل सेक्सन -->
            <div class="section-header">
                <h3>संस्थाको मुख्य विवरण अपडेट गर्ने</h3>
                <button class="toggle-btn" onclick="toggleSection('aboutContent', this)">खोल्नुहोस् ▾</button>
            </div>

            <div id="aboutContent" class="collapsible-content">
                <form id="aboutForm">
                    <div class="form-group">
                        <label>लोगोको लिङ्क (Logo URL):</label>
                        <input type="text" id="logo_url" required>
                    </div>
                    <div class="form-group">
                        <label>संस्थाको नाम (नेपालीमा):</label>
                        <input type="text" id="title_ne" required>
                    </div>
                    <div class="form-group">
                        <label>संस्थाको नाम (अंग्रेजीमा):</label>
                        <input type="text" id="title_en" required>
                    </div>
                    <div class="form-group">
                        <label>ठेगाना:</label>
                        <input type="text" id="address" required>
                    </div>
                    <div class="form-group">
                        <label>स्थापना / दर्ता मिति:</label>
                        <input type="text" id="reg_date" required>
                    </div>
                    <div class="form-group">
                        <label>कम्पनी दर्ता नं. र पान नम्बर:</label>
                        <input type="text" id="reg_no" required>
                    </div>
                    <div class="form-group">
                        <label>संस्थाको परिचय:</label>
                        <textarea id="introduction" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>कामको व्याख्या तथा उद्देश्यहरू:</label>
                        <textarea id="description" required></textarea>
                    </div>
                    <button type="submit">मुख्य विवरण सेभ गर्नुहोस्</button>
                </form>
            </div>

            <hr>

            <!-- संस्थापक समिति सेक्सन -->
            <div class="section-header">
                <h3>संस्थापक समितिमा नयाँ सदस्य थप्ने</h3>
                <button class="toggle-btn" onclick="toggleSection('committeeContent', this)">खोल्नुहोस् ▾</button>
            </div>

            <div id="committeeContent" class="collapsible-content">
                <form id="committeeForm">
                    <div class="form-group">
                        <label>पूरा नाम:</label>
                        <input type="text" id="c_name" placeholder="सदस्यको नाम" required>
                    </div>
                    <div class="form-group">
                        <label>पद (जस्तै: संयोजक):</label>
                        <input type="text" id="c_position" placeholder="पद" required>
                    </div>
                    <div class="form-group">
                        <label>सदस्य नम्बर:</label>
                        <input type="text" id="c_member_no" placeholder="सदस्य नं.">
                    </div>
                    <div class="form-group">
                        <label>सम्पर्क नम्बर:</label>
                        <input type="text" id="c_phone" placeholder="फोन नम्बर">
                    </div>
                    <div class="form-group">
                        <label>फोटोको लिङ्क (Photo URL):</label>
                        <input type="text" id="c_photo" placeholder="फोटोको लिङ्क">
                    </div>
                    <button type="submit">सदस्य थप्नुहोस्</button>
                </form>
            </div>

            <h3 style="margin-top: 35px; color: #1a365d;">संस्थापक सदस्यहरूको सूची</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>नाम</th>
                            <th>पद</th>
                            <th>सम्पर्क</th>
                            <th>नियन्त्रण</th>
                        </tr>
                    </thead>
                    <tbody id="committeeTableBody">
                        <!-- जाभास्क्रिप्टबाट लोड हुने -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yjfqlxohfyulzwkakclu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gxUdlUcuKDt0Wh1SK3XHZw_9C6fjr6a';
        
        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messageDiv = document.getElementById('message');

        // विवरण खोल्ने र बन्द गर्ने फंक्सन
        function toggleSection(contentId, btn) {
            const content = document.getElementById(contentId);
            if (content.style.display === 'block') {
                content.style.display = 'none';
                btn.innerText = 'खोल्नुहोस् ▾';
            } else {
                content.style.display = 'block';
                btn.innerText = 'बन्द गर्नुहोस् ▴';
            }
        }

        window.onload = function() {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                showDashboard();
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const { data } = await supabaseClient
                .from('admin_users')
                .select('*')
                .eq('username', user)
                .eq('password', pass)
                .single();

            if (data) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                showDashboard();
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'गलत युजरनेम वा पासवर्ड!';
            }
        });

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            messageDiv.innerText = '';
            loadAboutData();
            loadCommitteeData();
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        async function loadAboutData() {
            const { data } = await supabaseClient.from('about_us').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('logo_url').value = data.logo_url || '';
                document.getElementById('title_ne').value = data.title_ne || '';
                document.getElementById('title_en').value = data.title_en || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('reg_date').value = data.reg_date || '';
                document.getElementById('reg_no').value = data.reg_no || '';
                document.getElementById('introduction').value = data.introduction || '';
                document.getElementById('description').value = data.description || '';
            }
        }

        document.getElementById('aboutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const updatedData = {
                id: 1,
                logo_url: document.getElementById('logo_url').value,
                title_ne: document.getElementById('title_ne').value,
                title_en: document.getElementById('title_en').value,
                address: document.getElementById('address').value,
                reg_date: document.getElementById('reg_date').value,
                reg_no: document.getElementById('reg_no').value,
                introduction: document.getElementById('introduction').value,
                description: document.getElementById('description').value
            };

            const { error } = await supabaseClient.from('about_us').upsert(updatedData);
            if (error) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'त्रुटि: ' + error.message;
            } else {
                messageDiv.style.color = 'green';
                messageDiv.innerText = 'सफलतापूर्वक सेभ भयो!';
            }
        });

        document.getElementById('committeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newMember = {
                full_name: document.getElementById('c_name').value,
                position: document.getElementById('c_position').value,
                member_no: document.getElementById('c_member_no').value,
                phone: document.getElementById('c_phone').value,
                photo_url: document.getElementById('c_photo').value
            };

            const { error } = await supabaseClient.from('founder_committee').insert([newMember]);
            if (error) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'समितिमा थप्न त्रुटि: ' + error.message;
            } else {
                messageDiv.style.color = 'green';
                messageDiv.innerText = 'नयाँ सदस्य सफलतापूर्वक थपियो!';
                document.getElementById('committeeForm').reset();
                loadCommitteeData();
            }
        });

        async function loadCommitteeData() {
            const { data } = await supabaseClient.from('founder_committee').select('*');
            const tbody = document.getElementById('committeeTableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">कुनै विवरण छैन</td></tr>';
                return;
            }

            data.forEach(person => {
                tbody.innerHTML += `
                    <tr>
                        <td>${person.full_name}</td>
                        <td>${person.position}</td>
                        <td>${person.phone || '-'}</td>
                        <td><button class="btn-danger" onclick="deleteMember('${person.id}')">मेटाउनुहोस्</button></td>
                    </tr>
                `;
            });
        }

        async function deleteMember(id) {
            if (confirm('के तपाईं यो सदस्यलाई मेटाउन चाहनुहुन्छ?')) {
                const { error } = await supabaseClient.from('founder_committee').delete().eq('id', id);
                if (!error) {
                    loadCommitteeData();
                    messageDiv.style.color = 'green';
                    messageDiv.innerText = 'सफलतापूर्वक मेटाइयो!';
                }
            }
        }
    </script>
</body>
</html>

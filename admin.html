<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रशासन प्यानल - दशाैँदी समाज नेपाल</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Nepali Date Converter CDN -->
    <script src="https://nepalidateconverter.com/js/nepali-date-picker.min.js"></script>
    <link href="https://nepalidateconverter.com/css/nepali-date-picker.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #008000;
            --danger-color: #e53e3e;
            --edit-color: #3182ce;
            --print-color: #006400;
            --bg-color: #edf2f7;
            --card-bg: #ffffff;
            --text-color: #1a202c;
            --border-color: #cbd5e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .admin-container {
            max-width: 1400px;
            background: var(--card-bg);
            padding: 30px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .login-logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .main-header-box {
            background: linear-gradient(135deg, #1a365d, #2b6cb0);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(26, 54, 93, 0.2);
        }

        .main-header-box h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0.5px;
            color: white;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f7fafc;
            padding: 10px 15px;
            border-left: 5px solid var(--accent-color);
            border-radius: 0 6px 6px 0;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        .section-header h3 {
            margin: 0;
            color: var(--primary-color);
            font-size: 20px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: auto;
        }

        .toggle-btn:hover {
            background-color: #2b6cb0;
        }

        .print-btn {
            background-color: var(--print-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: auto;
        }

        .print-btn:hover {
            background-color: #004d00;
        }

        .collapsible-content {
            display: none;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
            font-size: 13px;
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.15);
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button[type="submit"]:hover {
            background-color: #006600;
        }

        .btn-action {
            padding: 4px 6px;
            font-size: 10px;
            border-radius: 4px;
            color: white;
            border: none;
            cursor: pointer;
            margin: 1px;
            font-weight: bold;
        }
        .btn-edit { background-color: var(--edit-color); }
        .btn-edit:hover { background-color: #2b6cb0; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: #c53030; }
        .btn-success { background-color: #38a169; }
        .btn-success:hover { background-color: #2f855a; }
        .btn-view { background-color: #d69e2e; }
        .btn-view:hover { background-color: #b7791f; }
        .btn-idcard { background-color: #805ad5; }
        .btn-idcard:hover { background-color: #6b46c1; }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e2e8f0;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .welcome-text {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 15px;
        }

        .logout-btn {
            background: #4a5568;
            color: white;
            border: none;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #2d3748;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
        }

        .hidden {
            display: none !important;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            text-align: center;
            font-size: 10px;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .table-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #1a365d;
        }

        hr {
            margin: 40px 0;
            border: 0;
            border-top: 1px solid var(--border-color);
        }

        .img-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
        .img-modal-content { max-width: 90%; max-height: 90%; position: relative; }
        .img-modal-content img { width: 100%; height: auto; max-height: 85vh; border-radius: 8px; border: 3px solid #fff; }
        .close-modal { position: absolute; top: -35px; right: 0; color: #fff; font-size: 28px; font-weight: bold; cursor: pointer; }

        .idcard-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 4000; padding: 70px 10px 30px 10px; overflow-y: auto; }
        .app-edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 3000; }
        .app-edit-content { background: #fff; width: 500px; max-width: 90%; padding: 25px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; max-height: 90vh; overflow-y: auto; }

        .print-header {
            display: none;
            text-align: center;
            margin-bottom: 15px;
            position: relative;
        }
        .print-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 5px;
            border: 2px solid #1a365d;
        }
        .print-title-1 { font-size: 22px; font-weight: 900; color: #1a365d; margin: 2px 0; }
        .print-meta { font-size: 12px; font-weight: 600; color: #333; margin: 2px 0; }
        .print-date { position: absolute; top: 0; right: 0; font-size: 11px; font-weight: bold; color: #000; }
        .print-section-title { font-size: 16px; font-weight: 800; text-align: center; margin: 10px 0; color: #1a365d; text-decoration: underline; }

        @media print {
            body * { visibility: hidden !important; }
            #idCardModal.active-card-modal, #idCardModal.active-card-modal * { visibility: visible !important; }
            #idCardModal.active-card-modal { 
                position: fixed !important; 
                left: 0 !important; 
                top: 0 !important; 
                width: 480px !important; 
                height: 700px !important; 
                background: #fff !important; 
                display: flex !important; 
                align-items: center !important;
                justify-content: center !important;
                padding: 0 !important; 
                margin: 0 !important;
                z-index: 9999 !important;
                overflow: visible !important;
            }
            .printable-section, .printable-section * { visibility: visible !important; }
            .printable-section { 
                position: absolute !important; 
                left: 0 !important; 
                top: 0 !important; 
                width: 100% !important; 
                background: #fff !important;
                display: block !important; 
            }
            .printable-section table {
                width: 100% !important;
                table-layout: fixed !important;
                font-size: 7px !important;
            }
            .printable-section th, 
            .printable-section td {
                padding: 2px 1px !important;
                word-wrap: break-word !important;
                white-space: normal !important;
                font-size: 7px !important;
            }
            .printable-section .table-avatar {
                width: 18px !important;
                height: 18px !important;
            }
            .printable-section .btn-action {
                display: inline-block !important;
                visibility: visible !important;
                background: none !important;
                color: #1a365d !important;
                border: none !important;
                padding: 0 !important;
                font-size: 6px !important;
                font-weight: bold !important;
            }
            .printable-section .btn-action::after {
                content: " [फोटो]";
            }
            .no-print, .top-header, .section-header, .no-print-card, .idcard-close-btn { display: none !important; }
            .print-header { display: block !important; }
            @page {
                size: landscape;
                margin: 0;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="

<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सदस्यता आवेदन फारम - दशाैँदी समाज नेपाल</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #edf2f7;
            color: #2d3748;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .form-container {
            max-width: 800px;
            background: #ffffff;
            padding: 40px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1a365d;
        }
        h2, h3 {
            text-align: center;
            color: #1a365d;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-col {
            flex: 1;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1a365d;
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.15);
        }
        button[type="submit"] {
            background-color: #008000;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button[type="submit"]:hover {
            background-color: #006600;
        }
        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="logo-container">
            <img src="https://i.postimg.cc/rmSrDP0W/last-l-2ogo-jpg.png" class="logo" alt="लोगो">
        </div>
        
        <h2>दशौँदी समाज नेपाल</h2>
        <h3>सदस्यता आवेदन फारम</h3>

        <form id="membershipForm">
            <div class="form-row">
                <div class="form-col">
                    <label>पूरा नाम थर:</label>
                    <input type="text" id="full_name" placeholder="तपाईंको पूरा नाम" required>
                </div>
                <div class="form-col">
                    <label>फेम्लि कोड (Family Code):</label>
                    <input type="text" id="family_code" placeholder="छ भने राख्नुहोस्">
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>मोबाइल नम्बर:</label>
                    <input type="tel" id="phone" placeholder="सम्पर्क मोबाइल नम्बर" required>
                </div>
                <div class="form-col">
                    <label>इमेल / युजर आइडी:</label>
                    <input type="text" id="identifier" placeholder="इमेल वा युजरनेम" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>जन्म मिति:</label>
                    <input type="text" id="dob" placeholder="वि.सं. (לשd.२०४९-०९-१०)" required>
                </div>
                <div class="form-col">
                    <label>रक्त समूह (Blood Group):</label>
                    <select id="blood_group">
                        <option value="">छान्नुहोस्</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>नागरिकता प्रमाण पत्र नं.:</label>
                    <input type="text" id="citizenship_no" placeholder="नागरिकता नम्बर" required>
                </div>
                <div class="form-col">
                    <label>पति/पत्नीको नाम:</label>
                    <input type="text" id="spouse_name" placeholder="पति वा पत्नीको नाम">
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>बुबाको नाम:</label>
                    <input type="text" id="father_name" placeholder="बुबाको नाम" required>
                </div>
                <div class="form-col">
                    <label>आमाको नाम:</label>
                    <input type="text" id="mother_name" placeholder="आमाको नाम" required>
                </div>
            </div>

            <div class="form-group">
                <label>बाजेको नाम:</label>
                <input type="text" id="grandfather_name" placeholder="बाजेको नाम" required>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>प्रदेश:</label>
                    <input type="text" id="province" placeholder="प्रदेश" required>
                </div>
                <div class="form-col">
                    <label>जिल्ला:</label>
                    <input type="text" id="district" placeholder="जिल्ला" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>गाउँपालिका / नगरपालिका:</label>
                    <input type="text" id="municipality" placeholder="पालिकाको नाम" required>
                </div>
                <div class="form-col">
                    <label>वडा नं.:</label>
                    <input type="text" id="ward" placeholder="वडा नम्बर" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>टोल:</label>
                    <input type="text" id="tole" placeholder="टोलको नाम">
                </div>
                <div class="form-col">
                    <label>फोटोको लिङ्क (Photo URL):</label>
                    <input type="text" id="photo_url" placeholder="फोटोको Direct Image Link राख्नुहोस्" required>
                </div>
            </div>

            <button type="submit">आवेदन पेश गर्नुहोस्</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yjfqlxohfyulzwkakclu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gxUdlUcuKDt0Wh1SK3XHZw_9C6fjr6a';
        
        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('membershipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');

            const formData = {
                full_name: document.getElementById('full_name').value.trim(),
                family_code: document.getElementById('family_code').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                identifier: document.getElementById('identifier').value.trim(),
                dob: document.getElementById('dob').value.trim(),
                blood_group: document.getElementById('blood_group').value,
                citizenship_no: document.getElementById('citizenship_no').value.trim(),
                spouse_name: document.getElementById('spouse_name').value.trim(),
                father_name: document.getElementById('father_name').value.trim(),
                mother_name: document.getElementById('mother_name').value.trim(),
                grandfather_name: document.getElementById('grandfather_name').value.trim(),
                province: document.getElementById('province').value.trim(),
                district: document.getElementById('district').value.trim(),
                municipality: document.getElementById('municipality').value.trim(),
                ward: document.getElementById('ward').value.trim(),
                tole: document.getElementById('tole').value.trim(),
                photo_url: document.getElementById('photo_url').value.trim(),
                status: 'Pending'
            };

            const { error } = await supabaseClient.from('membership_applications').insert([formData]);

            if (error) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'त्रुटि: ' + error.message;
            } else {
                messageDiv.style.color = 'green';
                messageDiv.innerText = 'तपाईंको सदस्यता आवेदन सफलतापूर्वक पेश भयो!';
                document.getElementById('membershipForm').reset();
            }
        });
    </script>
</body>
</html>
